pixelcore75-server:
  build:
    context: .
    dockerfile: Dockerfile
    args:
      JDK_VERSION: "21"
  image: pixelcore75-server:latest
  environment:
    SERVER_PORT: "8080"
    JAVA_OPTS: ""

  ports:
    - "8080:8080"
  healthcheck:
    # /v1/status is the permitAll health endpoint; the root path answers 401 and
    # wget exits non-zero, leaving the container permanently unhealthy.
    test: [ "CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/v1/status || exit 1" ]
    interval: 30s
    timeout: 5s
    start_period: 15s
    retries: 3
  restart: unless-stopped