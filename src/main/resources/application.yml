spring:
  application:
    name: crypto-ticker-server

  datasource:
    url: jdbc:postgresql://localhost:5432/pixelcore75
    username: pixelcore75
    password: difficultpassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      leak-detection-threshold: 10000
      max-lifetime: 1800000
      keepalive-time: 300000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing DBs (schema created by the old ddl-auto:update) are baselined at
    # version 1, so V1__baseline.sql (= that same schema) is skipped there and
    # only runs on fresh databases. See docs/optimization-plan.md §3.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-missing-creator-properties: true
      fail-on-null-creator-properties: true
      fail-on-invalid-subtype: true
    mapper:
      accept-case-insensitive-properties: false

logging:
  level:
    root: INFO

# Actuator health only (plan §6 decision): no metrics backend yet — the Actuator
# wiring does not block adding Micrometer later.
management:
  endpoints:
    web:
      exposure:
        include: health,info

# JobRunr (plan §4): the panel rotation jobs run on a Postgres-backed JobRunr
# BackgroundJobServer. The dashboard on :8000 is the traceability win: one job per
# panel with success/failure history. NOTE: the plan wanted a 1 s poll interval for
# second-scale rotation delays, but JobRunr 8.8.2 enforces a >= 5 s poll interval
# against SQL storage (validated in AbstractStorageProvider, no bypass) — so slot
# boundaries can fire up to 5 s late. Slots are 5-60 s and the panel holds its last
# frame until the next batch, so the drift is visible but harmless; 5 is the minimum.
jobrunr:
  background-job-server:
    enabled: true
    poll-interval-in-seconds: 5
    thread-type: virtual-threads
    worker-count: 8
  database:
    type: sql
  dashboard:
    enabled: true
    port: 8000

pixelcore75:
  mqtt:
    # Broker location + client id, both env-overridable (deployment off-localhost).
    # The client id MUST be stable across restarts: the transport connects with
    # cleanSession(false), so a random per-boot id would orphan a persistent
    # broker session (plus its queued QoS 1 messages) on every restart.
    broker-url: ${PIXELCORE75_MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${PIXELCORE75_MQTT_CLIENT_ID:pixelcore75-server}
  admin:
    email: admin@localhost
    name: admin
  crypto:
    client: coingecko
    apikey: ${CRYPTO_API_KEY:}
    currency: euro
  soccer:
    client: espn
    apikey: ${SOCCER_API_KEY:}
    basePath: https://sports.core.api.espn.com/v2/sports/
  spotify:
    # OAuth PKCE app from the Spotify Developer Dashboard; empty = screen shows
    # its "not connected" card. The redirect URI must match the dashboard entry.
    client-id: ${SPOTIFY_CLIENT_ID:}
    redirect-uri: ${SPOTIFY_REDIRECT_URI:http://localhost:8080/v1/spotify/oauth/callback}
    # Where the OAuth callback bounces the browser back to (the SPA), with ?spotify=outcome.
    post-connect-redirect: ${SPOTIFY_POST_CONNECT_REDIRECT:http://localhost:5173/}
    # Live-refresh cadence for a playing slot (ms): each refresh re-fetches the
    # playback state from the Web API. 5000 default; the API is rate-limited, so
    # values much below ~2000 risk 429s on top of the added polling traffic.
    refresh-ms: ${SPOTIFY_REFRESH_MS:2000}

  jwt:
    # Secrets come from the environment. Empty default = the dev fallback in
    # JwtService kicks in; with the "prod" profile active a blank secret is a
    # hard boot failure (fail-fast, no silent known-secret deploys).
    secret: ${JWT_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
    access-expiration: 7200000     # 2 HRS
    refresh-expiration: 604800000 # 7 days